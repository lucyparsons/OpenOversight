name: Check for Schema Changes

on:
  pull_request:
    branches:
      - develop

jobs:
  check-schema:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r dev-requirements.txt
          sudo apt-get update && sudo apt-get install -y graphviz

      - name: Run create_db_diagram
        run: |
          make create_db_diagram | tee output.log
          if ! grep -q "No schema changes detected!" output.log; then
            echo "❌ Detected schema changes. Please run 'make create_db_diagram' and commit the updated diagram."
            exit 1
          fi

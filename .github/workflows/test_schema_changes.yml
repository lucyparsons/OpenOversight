name: Check for Schema Changes

on:
  pull_request:
    branches:
      - develop

jobs:
  check-schema:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:latest
        ports:
          - 5432:5432
        env:
          POSTGRES_USER: openoversight
          POSTGRES_PASSWORD: terriblepassword
          POSTGRES_DB: openoversight-dev
        options: >-
          --health-cmd="pg_isready -U openoversight"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Run create_db_diagram in Docker
        run: docker compose run --rm web-test make db_diagram

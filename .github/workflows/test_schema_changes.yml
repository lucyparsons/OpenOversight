name: Check for Schema Changes

on:
  pull_request:
    branches:
      - develop

jobs:
  check-schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r dev-requirements.txt
          pip install eralchemy  # Ensure eralchemy is installed

      - name: Set up Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz

      - name: Build application
        run: |
          PYTHON_VERSION=${{ matrix.python-version }} make build_with_version

      - name: Run create_db_diagram
        run: |
          make create_db_diagram | tee output.log
          if ! grep -q "No schema changes detected!" output.log; then
            echo "❌ Detected schema changes. Please run 'make create_db_diagram' and commit the updated diagram."
            exit 1
          fi

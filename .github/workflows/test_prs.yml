name: CI

on:
  pull_request:
    branches:
      - develop

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    env:
      FLASK_APP: OpenOversight.app
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: PYTHON_VERSION=${{ matrix.python-version }} make test_with_version
      # Upload playwright traces if tests fail
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-traces
          path: build/test-results/
      - name: Set up Graphviz
        run: sudo apt-get update && sudo apt-get install -y graphviz
      - name: Check for schema changes
        run: |
          make create_db_diagram | tee output.log
          if ! grep -q "No schema changes detected!" output.log; then
            echo "❌ Detected schema changes. Please run 'make create_db_diagram' and commit the updated diagram."
            exit 1
          fi

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - uses: pre-commit/action@v3.0.0
